services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - test-network
    volumes:
      - mongo-data:/data/db
    restart: always # Add this line

  backend:
    build: ./backend
    ports:
      - "5050:5050"
    environment:
      PORT: 5050
      JWT_SECRET: secret-code
      MONGO_URI: mongodb://mongodb:27017/auth-db
    networks:
      - test-network
    depends_on:
      - mongodb
    restart: always # Ensures backend restarts if it crashes

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - test-network
    # environment:

networks:
  test-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
